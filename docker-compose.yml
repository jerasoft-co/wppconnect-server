version: "3"

services:
  wppconnect:
    container_name: wpp-server
    restart: unless-stopped
    build:
      context: .
    image: jerasoft-jerasoft-co-wppconnect-server-wppconnect-fs0scs8w:jerasoft-jerasoft-co-wppconnect-server-wppconnect-fs0scs8w
    volumes:
      - ./config.ts:/usr/src/wpp-server/config.ts
      - ./wppconnect_tokens:/usr/src/wpp-server/tokens
    ports:
      - "21465:21465"

volumes:
  wppconnect_tokens: {}
